<!doctype html>
<html lang="ne"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoomKhoj Live Voice</title>
<style>body{background:#0b1220;color:#f4f7ff;font:17px system-ui;margin:0}.card{max-width:640px;margin:7vh auto;padding:28px;background:#172236;border-radius:20px}button,input{font:inherit;padding:12px;margin:6px;border-radius:10px;border:0}button{cursor:pointer}button:disabled{opacity:.45}#start{background:#44dd9b}#end{background:#ff9b9b}#log{white-space:pre-wrap;line-height:1.7}small{color:#bbc9df}audio{width:100%}</style>
<div class="card"><h1>🎙️ RoomKhoj Live Voice</h1><p>Start थिच्नुहोस् र सीधै बोल्नुहोस्। बीचमा बोल्दा AI रोकिन्छ।</p>
<div id="login"><input id="password" type="password" aria-label="Access password" placeholder="Access password"><button id="signIn">Login</button></div>
<div id="panel" hidden><button id="start">Start Live Call</button><button id="mute" disabled>Mute mic</button><button id="end" disabled>End Call</button><button id="logout">Logout</button></div>
<p id="status" role="status">Ready</p><audio id="speaker" autoplay controls></audio>
<p><small>Realtime API billing लागू हुन्छ; रु. ३/min को सीमा लागू हुँदैन। परीक्षण call अधिकतम ५ मिनेट। आवाज OpenAI मा live पठाइन्छ।</small></p><div id="log" aria-live="polite"></div></div>
<script>
const $=id=>document.getElementById(id),API='https://api-ai.roomkhoj.com';
let token=null,call=null,generation=0;
const status=t=>$('status').textContent=t;
const log=t=>{$('log').textContent=($('log').textContent+'\n'+t).slice(-12000)};
async function api(path,data){
 const r=await fetch(API+'/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(data),signal:AbortSignal.timeout(60000)});
 let v;try{v=await r.json()}catch{throw Error('HTTP '+r.status+': Backend/Nginx response JSON होइन')}
 if(!r.ok)throw Error(v.error||'HTTP '+r.status);return v;
}
function cleanup(c){
 if(!c)return;clearTimeout(c.timer);clearTimeout(c.connectTimer);c.abort=true;
 if(c.dc){c.dc.onclose=null;c.dc.close()}if(c.pc){c.pc.onconnectionstatechange=null;c.pc.close()}
 c.stream?.getTracks().forEach(t=>t.stop());
 if(call===c){call=null;$('speaker').pause();$('speaker').srcObject=null}
}
async function endCall(message='Call ended'){
 generation++;const c=call;cleanup(c);
 $('start').disabled=false;$('end').disabled=true;$('mute').disabled=true;$('mute').textContent='Mute mic';status(message);
 if(c?.id){try{await api('end',{id:c.id})}catch(e){log('End: '+e.message+'; server timeout remains active')}}
}
$('signIn').onclick=async()=>{
 $('signIn').disabled=true;try{const r=await api('login',{password:$('password').value});token=r.token;$('password').value='';$('login').hidden=true;$('panel').hidden=false;status('Ready for live call')}catch(e){status(e.message)}finally{$('signIn').disabled=false}
};
$('password').onkeydown=e=>{if(e.key==='Enter')$('signIn').click()};
$('start').onclick=async()=>{
 if(call||!token)return;
 const c={};call=c;const gen=++generation;$('start').disabled=true;$('end').disabled=false;status('Microphone जोड्दैछु…');
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection)throw Error('HTTPS र WebRTC support भएको browser चाहिन्छ');
  c.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  if(c.abort||gen!==generation){cleanup(c);return}
  c.pc=new RTCPeerConnection();
  c.pc.ontrack=e=>{if(call!==c)return;$('speaker').srcObject=e.streams[0]||new MediaStream([e.track]);$('speaker').play().catch(()=>status('आवाज सुन्न तलको audio Play थिच्नुहोस्'))};
  c.pc.onconnectionstatechange=()=>{
   if(call!==c)return;
   if(c.pc.connectionState==='connected'){clearTimeout(c.connectTimer);status('🎤 Live जोडियो—बोल्नुहोस्');$('mute').disabled=false}
   if(['failed','closed'].includes(c.pc.connectionState))void endCall('Connection ended; Start थिचेर फेरि जोड्नुहोस्');
   if(c.pc.connectionState==='disconnected')status('Network reconnect हुँदैछ…');
  };
  c.stream.getTracks().forEach(t=>c.pc.addTrack(t,c.stream));
  c.dc=c.pc.createDataChannel('oai-events');
  c.dc.onopen=()=>{if(call===c)c.dc.send(JSON.stringify({type:'response.create',response:{instructions:'Briefly greet the caller in Nepali, introduce yourself as RoomKhoj AI, and ask how you can help.'}}))};
  c.dc.onclose=()=>{if(call===c)void endCall('Live session समाप्त भयो')};
  c.dc.onmessage=e=>{
   if(call!==c)return;let v;try{v=JSON.parse(e.data)}catch{return}
   if(v.type==='input_audio_buffer.speech_started')status('🎤 सुन्दैछु…');
   if(v.type==='input_audio_buffer.speech_stopped')status('जवाफ आउँदैछ…');
   if(v.type==='response.output_audio_transcript.done')log('AI: '+v.transcript);
   if(v.type==='conversation.item.input_audio_transcription.completed')log('You: '+v.transcript);
   if(v.type==='output_audio_buffer.started')status('🔊 AI बोल्दैछ—बीचमा बोल्न सक्नुहुन्छ');
   if(v.type==='output_audio_buffer.stopped'||v.type==='output_audio_buffer.cleared')status('🎤 सुन्दैछु…');
   if(v.type==='error')log('API: '+(v.error?.message||'Realtime error'));
   if(v.type==='response.done'&&v.response?.status==='failed')log('Reply failed: '+(v.response.status_details?.error?.message||'Unknown error'));
  };
  const offer=await c.pc.createOffer();await c.pc.setLocalDescription(offer);
  status('Live voice जोड्दैछु…');
  const r=await api('session',{mode:'realtime',sdp:offer.sdp});c.id=r.id;
  if(c.abort||gen!==generation){cleanup(c);await api('end',{id:r.id});return}
  await c.pc.setRemoteDescription({type:'answer',sdp:r.sdp});
  c.timer=setTimeout(()=>void endCall('५ मिनेटको परीक्षण सकियो'),r.maxDurationSeconds*1000);
  c.connectTimer=setTimeout(()=>{if(call===c&&c.pc.connectionState!=='connected')void endCall('Connection timeout; network जाँच्नुहोस्')},20000);
 }catch(e){if(gen===generation){await endCall('⚠️ '+e.message)}else cleanup(c)}
};
$('end').onclick=()=>void endCall();
$('mute').onclick=()=>{const t=call?.stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'Mute mic':'Unmute mic'}};
$('logout').onclick=async()=>{await endCall();token=null;$('panel').hidden=true;$('login').hidden=false;status('Logged out')};
window.addEventListener('pagehide',()=>{const c=call;if(c?.id&&token)fetch(API+'/api/end',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id:c.id}),keepalive:true}).catch(()=>{});cleanup(c)});
</script></html>
